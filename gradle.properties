# ==============================================================================
# THZ-LANG WORKSPACE — Configurações Globais de Performance do Gradle
#
# Estas configs aplicam-se a todos os subprojetos (core, cli, gui, api).
# Configurações experimentais do Gradle 9.x para máxima velocidade.
# ==============================================================================

# --- Cache de Configuração ---
#Serializa o grafo de tasks para reuso entre builds (reduz configuração em ~90%)
org.gradle.configuration-cache=true
# Cache de configuração em paralelo (experimental, Gradle 9.1+)
org.gradle.configuration-cache.problems=warn

# --- Build Cache ---
# Cache de outputs de tasks entre builds (local + opcional remote)
org.gradle.caching=true

# --- Execução Paralela ---
# Executa tasks independentes em paralelo (usa todos os cores)
org.gradle.parallel=true

# --- File System Watch ---
# Monitora mudanças no filesystem para builds incrementais rápidos
org.gradle.vfs.watch=true

# --- Daemon ---
# Mantém Daemon vivo entre chamadas para startup quase instantâneo
org.gradle.daemon=true

# --- JVM do Gradle ---
# Memória generosa + GC paralelo para builds rápidos
org.gradle.jvmargs=-Xmx2096m -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8 -Dsun.stdout.encoding=UTF-8 -Dsun.stderr.encoding=UTF-8 -Dsun.stdin.encoding=UTF-8 -Dnative.encoding=UTF-8 -XX:+UseParallelGC -XX:+UseStringDeduplication

# --- Java Toolchain ---
# Descoberta automática de JDK 25 (Windows Scoop + Linux Containers / Opt)
org.gradle.java.installations.paths=C:/Users/lucas/scoop/apps/openjdk25/current,/opt/java/openjdk,/usr/lib/jvm/temurin-25-jdk-amd64,/usr/lib/jvm/temurin-25-jdk-arm64,/usr/lib/jvm/java-25-openjdk-amd64,/usr/lib/jvm/java-25-openjdk-arm64
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false

# ---Workers ---
# Número de workers paralelos (removido = auto-detectar cores)
# org.gradle.workers.max=

# --- Isolated Projects (experimental, Gradle 9.2+) ---
# Isola cada subprojeto para melhor cache e parallelismo
org.gradle.isolated.projects=true
