name: Release Please (Versionamento Semântico Automático)

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Avaliar Commits e Criar Release PR / Tag
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          release-type: node
          package-name: thz-lang
          extra-files: |
            version.txt
