name: THZ-LANG CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  engine-node:
    name: Node/TypeScript Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: thz-lang-engine/package-lock.json

      - name: Install dependencies
        working-directory: thz-lang-engine
        run: npm ci

      - name: Run test suite (159 tests)
        working-directory: thz-lang-engine
        run: npm test

      - name: Run static type & contract check
        working-directory: thz-lang-engine
        run: npm run thz:check -- --estrito

      - name: Build Playground Web
        working-directory: thz-lang-engine
        run: npm run playground:build

      - name: Compile VS Code Extension
        working-directory: thz-lang-engine
        run: npm run extension:compile

  # Motor JVM (Java 25): movido para repos independentes thz-core / thz-cli / thz-gui.
  # Cada um possui seu próprio workflow de CI (.github/workflows/ci.yml).
