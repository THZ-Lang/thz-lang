# ==============================================================================
# THZ-LANG ENGINE JVM — Configurações de Performance do Gradle
# ==============================================================================

# Execução em paralelo de tasks e testes
org.gradle.parallel=true

# Cache local de compilações e execuções intermediárias
org.gradle.caching=true

# Monitoramento de sistema de arquivos para builds incrementais rápidos
org.gradle.vfs.watch=true

# Daemon do Gradle para acelerar chamadas repetidas
org.gradle.daemon=true

# Opções de memória da JVM do Gradle
org.gradle.jvmargs=-Xmx2096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Descoberta de instalações Java (Scoop / JDK 25)
# org.gradle.java.installations.paths=C:/Users/lucas/scoop/apps/openjdk25/current
org.gradle.java.installations.auto-detect=true
