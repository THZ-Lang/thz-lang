<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THZ - Particle Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <script type="thz">
        const app = (() => {
            let canvas = document.getElementById('particles');
            let ctx = null;
            let width = 800, height = 600;
            let particles = [];
            
            // Parse THZ script - extract animation instructions
            const parseScript = (code) => {
                const lines = code.split('\n').filter(line => line.trim());
                const config = { speed: 'normal', count: 150, colors: ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4'] };
                
                for (const line of lines) {
                    if (line.startsWith('//')) continue;
                    
                    const parts = line.trim().split(/\s+/);
                    if (parts[0] === 'PARTICLE') {
                        config.count++;
                    } else if (parts[0] === 'COLOR') {
                        config.colors.push(parts.slice(1, 4).join(' '));
                    }
                }
                
                return config;
            };
            
            // Particle class
            class Particle {
                constructor(x, y) {
                    this.x = x || Math.random() * width;
                    this.y = y || Math.random() * height;
                    this.vx = (Math.random() - 0.5) * config.speed * 2;
                    this.vy = (Math.random() - 0.5) * config.speed * 2;
                    this.size = Math.random() * 3 + 1;
                    this.color = config.colors[Math.floor(Math.random() * config.colors.length)];
                    this.life = 1.0;
                    this.decay = Math.random() * 0.01 + 0.005;
                }
                
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    
                    // Bounce off walls
                    if (this.x < 0 || this.x > width) this.vx *= -1;
                    if (this.y < 0 || this.y > height) this.vy *= -1;
                    
                    this.life -= this.decay;
                }
                
                draw(ctx) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = Math.max(0, this.life);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }
            
            // Initialize canvas
            const init = () => {
                canvas.width = width;
                canvas.height = height;
                ctx = canvas.getContext('2d');
                particles = [];
                
                // Create initial particle cloud
                for (let i = 0; i < config.count * 2; i++) {
                    particles.push(new Particle());
                }
            };
            
            // Animation loop
            const animate = () => {
                ctx.fillStyle = 'rgba(102, 126, 234, 0.15)';
                ctx.fillRect(0, 0, width, height);
                
                for (const particle of particles) {
                    particle.update();
                    particle.draw(ctx);
                }
                
                // Clean up dead particles
                particles = particles.filter(p => p.life > 0);
                
                // Add new particles periodically
                if (particles.length < config.count * 3 && Math.random() < 0.1) {
                    particles.push(new Particle());
                }
                
                requestAnimationFrame(animate);
            };
            
            // Handle window resize
            const handleResize = () => {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                init();
            };
            
            return {
                parseScript,
                init,
                animate,
                handleResize
            };
        })();
    </script>
</body>
</html>
